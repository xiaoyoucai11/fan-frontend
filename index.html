<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能风扇控制面板</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .panel {
      width: 360px;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .row {
      margin: 10px 0;
      font-size: 16px;
    }

    .btns {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      width: 48%;
      height: 42px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .on { background: #28a745; }
    .off { background: #dc3545; }

    .slider-box {
      margin-top: 20px;
    }

    input[type="range"] {
      width: 100%;
    }

    .msg {
      margin-top: 16px;
      color: #555;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>智能风扇控制面板</h1>

    <div class="row">设备状态：<span id="online">未连接</span></div>
    <div class="row">风扇状态：<span id="power">关闭</span></div>
    <div class="row">当前风速：<span id="speedText">0</span>%</div>

    <div class="btns">
      <button class="on" onclick="turnOn()">开启</button>
      <button class="off" onclick="turnOff()">关闭</button>
    </div>

    <div class="slider-box">
      <label for="speed">调节风速：</label>
      <input type="range" id="speed" min="0" max="100" value="0" oninput="changeSpeed(this.value)">
    </div>

    <div class="msg" id="msg">等待连接服务器...</div>
  </div>

  <script>
    let ws;

    function connectWS() {
      // 这里直接自动连当前公网地址
      ws = new WebSocket("https://fan-backend-u177.onrender.com");

      ws.onopen = function () {
        document.getElementById('msg').innerText = '连接服务器成功';

        ws.send(JSON.stringify({
          type: 'register',
          role: 'client'
        }));
      };

      ws.onmessage = function (event) {
        const data = JSON.parse(event.data);

        if (data.type === 'status') {
          document.getElementById('online').innerText = data.online ? '在线' : '离线';
          document.getElementById('power').innerText = data.power === 'on' ? '开启' : '关闭';
          document.getElementById('speedText').innerText = data.speed;
          document.getElementById('speed').value = data.speed;
          document.getElementById('msg').innerText = '状态已同步';
        }
      };

      ws.onclose = function () {
        document.getElementById('online').innerText = '断开';
        document.getElementById('msg').innerText = '连接断开，3秒后重连...';
        setTimeout(connectWS, 3000);
      };

      ws.onerror = function () {
        document.getElementById('msg').innerText = '连接出错';
      };
    }

    function turnOn() {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: 'control',
          cmd: 'on'
        }));
        document.getElementById('msg').innerText = '已发送开启命令';
      }
    }

    function turnOff() {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: 'control',
          cmd: 'off'
        }));
        document.getElementById('msg').innerText = '已发送关闭命令';
      }
    }

    function changeSpeed(value) {
      document.getElementById('speedText').innerText = value;

      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: 'control',
          cmd: 'speed',
          value: Number(value)
        }));
        document.getElementById('msg').innerText = `已发送风速 ${value}%`;
      }
    }

    connectWS();
  </script>
</body>
</html>
