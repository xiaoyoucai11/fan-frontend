<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能风扇控制面板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #fff9eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .panel {
      width: 100%;
      max-width: 380px;
      background: #fff8e8;
      padding: 30px 26px;
      border-radius: 28px;
      box-shadow: 
        0 10px 30px rgba(180, 150, 100, 0.15),
        0 4px 12px rgba(200, 170, 120, 0.1);
      border: 1px solid rgba(235, 215, 180, 0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 700;
      color: #5c4b38;
      background: #ffeecd;
      padding: 12px;
      border-radius: 18px;
      letter-spacing: 1px;
    }
    .row {
      margin: 12px 0;
      font-size: 15px;
      color: #8c7b66;
      padding: 14px 18px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .row::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.8;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .row1 { background: linear-gradient(90deg, #fff1e6, #ffe8d9); }
    .row2 { background: linear-gradient(90deg, #fff3e8, #ffe6d0); }
    .row3 { background: linear-gradient(90deg, #fff5eb, #ffe3c5); }
    .row4 { background: linear-gradient(90deg, #fff7ee, #ffe0bb); }
    .row5 { background: linear-gradient(90deg, #fff9f0, #ffddb0); }
    .row span {
      font-weight: 600;
      color: #d48b37;
      margin-left: auto;
      font-size: 16px;
    }
    .btns {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      gap: 12px;
    }
    button {
      width: 48%;
      height: 44px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 500;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(150, 120, 80, 0.25);
    }
    button:active {
      transform: translateY(0px);
      box-shadow: 0 2px 6px rgba(150, 120, 80, 0.15);
    }
    .on {background:#57c289;}
    .off {background:#e57373;}
    .mode-box {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      transition: all 0.2s;
    }
    .mode-btn.active {
      transform: scale(1.03);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .auto {background:#64b5f6;color:#fff;}
    .manual {background:#ffd180;color:#333;}
    .slider-box {
      margin-top: 18px;
      padding: 6px 4px;
    }
    .slider-box label {
      font-size: 15px;
      color: #8c7b66;
      display: block;
      margin-bottom: 10px;
    }
    input[type="range"] {
      width: 100%;
      height: 10px;
      border-radius: 30px;
      outline: none;
      -webkit-appearance: none;
      background: #e8e0d0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #ffb74d;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 183, 77, 0.3);
      margin-top: -6px;
    }
    @supports (-webkit-appearance: none) {
      input[type="range"] {
        background: linear-gradient(90deg, 
        #ff9a9e, #fad0c4, #f6d365, #a8e063, #56ccf2) 
        0 0 / var(--value, 0%) 100% no-repeat, #e8e0d0;
      }
    }
    .msg {
      margin-top: 20px;
      color: #a08f78;
      min-height: 20px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="panel">
  <h1>智能风扇控制面板</h1>
  <div class="row row1">
    设备状态：<span id="online">未连接</span>
  </div>
  <div class="row row2">
    温度：<span id="temp">--</span> ℃
  </div>
  <div class="row row3">
    湿度：<span id="humi">--</span> %RH
  </div>
  <div class="row row4">
    运行模式：<span id="modeText">自动</span>
  </div>
  <div class="row row5">
    当前风速：<span id="speedText">0</span>%
  </div>

  <div class="btns">
    <button class="on" onclick="turnOn()">开启</button>
<button class="off" onclick="turnOff()">关闭</button>
  </div>

  <div class="mode-box">
    <button class="mode-btn auto active" id="autoBtn" onclick="setMode(1)">自动模式</button>
    <button class="mode-btn manual" id="manualBtn" onclick="setMode(0)">手动模式</button>
  </div>

  <div class="slider-box">
    <label for="speed">调节风速：</label>
    <input type="range" id="speed" min="0" max="100" value="0" disabled
           oninput="this.style.setProperty('--value', this.value + '%');changeSpeed(this.value)">
  </div>
  <div class="msg" id="msg">等待连接服务器...</div>
</div>

<script>
let ws;
const wsUrl = "wss://fan-backend-u177.onrender.com";

// 模式滑块控制
function updateSliderDisabled(mode) {
  const slider = document.getElementById('speed');
  slider.disabled = mode === 1; // 自动=禁用，手动=启用
}
// 模式按钮高亮
function updateModeBtnActive(mode) {
  document.getElementById('autoBtn').classList.toggle('active', mode === 1);
  document.getElementById('manualBtn').classList.toggle('active', mode === 0);
}

function connectWS() {
  ws = new WebSocket(wsUrl);
  ws.onopen = function () {
    document.getElementById('msg').innerText = '连接服务器成功';
    ws.send(JSON.stringify({type:'register',role:'client'}));
  };
  ws.onmessage = function (event) {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'status') {
        document.getElementById('online').innerText = data.online ? '在线' : '离线';
        // 离线显示--
        document.getElementById('temp').innerText = data.online ? data.temp : '--';
        document.getElementById('humi').innerText = data.online ? data.humi : '--';
        document.getElementById('modeText').innerText = data.mode === 1 ? '自动' : '手动';
        document.getElementById('speedText').innerText = data.speed;
        document.getElementById('speed').value = data.speed;
        document.getElementById('speed').style.setProperty('--value', data.speed + '%');
        updateSliderDisabled(data.mode);
        updateModeBtnActive(data.mode);
        document.getElementById('msg').innerText = '状态已同步';
      }
    } catch (e) {
      console.error('解析消息失败', e);
    }
  };
  ws.onclose = function () {
    document.getElementById('online').innerText = '断开';
    document.getElementById('msg').innerText = '连接断开，3秒后重连...';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = function () {
    document.getElementById('msg').innerText = '连接出错';
  };
}

function turnOn() {
  if(ws&&ws.readyState===1) {
    ws.send(JSON.stringify({type:'control',cmd:'on'}));
    document.getElementById('msg').innerText='已发送开启命令';
  }
}

function turnOff() {
  if(ws&&ws.readyState===1) {
    ws.send(JSON.stringify({type:'control',cmd:'off'}));
    document.getElementById('msg').innerText='已发送关闭命令';
  }
}

function changeSpeed(value) {
  document.getElementById('speedText').innerText = value;
  if(ws&&ws.readyState===1) {
    ws.send(JSON.stringify({type:'control',cmd:'speed',value:Number(value)}));
    document.getElementById('msg').innerText = `已发送风速 ${value}%`;
  }
}

function setMode(mode) {
  const modeName = mode === 1 ? '自动' : '手动';
  document.getElementById('modeText').innerText = modeName;
  updateSliderDisabled(mode);
  updateModeBtnActive(mode);
  if(ws&&ws.readyState===1) {
    ws.send(JSON.stringify({type:'control',cmd:'mode',value:mode}));
    document.getElementById('msg').innerText = `已切换至${modeName}模式`;
  }
}

connectWS();
</script>
</body>
</html>
